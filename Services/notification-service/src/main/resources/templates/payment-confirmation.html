<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
        }
        .email-header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .email-body {
            margin: 20px 0;
        }
        .email-footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Payment Confirmation</h1>
    </div>
    <div class="email-body">
        <p>Dear <span th:text="${patientName}">Customer</span>,</p>
        <p>Thank you for your recent payment of <strong th:text="${amount}">amount</strong>.</p>
        <p>Your payment for the <strong th:text="${orderReference}">order</strong> has been successfully processed.</p>
        <p>If you have any questions, feel free to contact us.</p>
    </div>
    <div class="email-footer">
        <p>&copy; 2024 Alfred Coding. All rights reserved.</p>
    </div>
</div>
</body>
</html>
