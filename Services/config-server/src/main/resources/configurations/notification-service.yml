server:
  port: 8040
spring:
  data:
    mongodb:
      username: alfred
      password: alfred
      host: localhost
      port: 27017
      database: notification
      authentication-database: admin
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup  # Only one group ID allowed per consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: paymentConfirmation:com.alfred.notification.notificationservice.kafka.payment.PaymentConfirmation,appointmentConfirmation:com.alfred.notification.notificationservice.kafka.appintment.AppointmentConfirmation
  mail:
    host: localhost
    port: 1025
    username: alfred
    password: alfred
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
